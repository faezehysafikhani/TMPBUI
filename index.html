<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مدیریت وظایف (TM)</title>
    <meta name="description" content="سامانه هوشمند و پیشرفته مدیریت وظایف، برنامه‌ریزی، پروژه‌ها و یادداشت‌های شخصی" />

    <!-- Open Graph Meta Tags for social media / messenger link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مدیریت وظایف (TM)" />
    <meta property="og:title" content="مدیریت وظایف (TM) | سامانه هوشمند مدیریت کارها" />
    <meta property="og:description" content="سامانه هوشمند و پیشرفته مدیریت وظایف، برنامه‌ریزی، پروژه‌ها و یادداشت‌های شخصی" />
    <meta property="og:url" content="https://task.parspmi.ir" />

    <!-- Primary Requested App Icon URL for link previews -->
    <meta property="og:image" content="https://task.parspmi.ir/icon.svg" />
    <meta property="og:image:secure_url" content="https://task.parspmi.ir/icon.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="آیکون برنامه مدیریت وظایف" />

    <!-- Fallback PNG representation for WhatsApp/crawlers strictly requiring raster formats -->
    <meta property="og:image" content="https://task.parspmi.ir/icon-512.png" />
    <meta property="og:image:secure_url" content="https://task.parspmi.ir/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Schema.org Microdata for link preview crawlers -->
    <meta itemprop="name" content="مدیریت وظایف (TM)" />
    <meta itemprop="description" content="سامانه هوشمند و پیشرفته مدیریت وظایف، برنامه‌ریزی، پروژه‌ها و یادداشت‌های شخصی" />
    <meta itemprop="image" content="https://task.parspmi.ir/icon.svg" />

    <!-- Legacy WhatsApp Link Preview Image Source -->
    <link rel="image_src" href="https://task.parspmi.ir/icon.svg" />

    <!-- Twitter Card Meta Tags (Square App Icon Thumbnail) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="مدیریت وظایف (TM)" />
    <meta name="twitter:description" content="سامانه هوشمند و پیشرفته مدیریت وظایف، برنامه‌ریزی و پروژه‌ها" />
    <meta name="twitter:image" content="https://task.parspmi.ir/icon.svg" />
    <meta name="twitter:image:alt" content="آیکون برنامه مدیریت وظایف" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Web App & Add to Home Screen Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مدیریت وظایف (TM)" />
    <meta name="application-name" content="مدیریت وظایف (TM)" />

    <!-- Fonts & Non-blocking Preload Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
