<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kanbanBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="kanbanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#kanbanBgGrad)" />
  
  <!-- Glossy Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />

  <!-- Lucide Kanban Icon Graphic -->
  <g filter="url(#kanbanGlow)">
    <!-- Outer Board Frame -->
    <rect x="80" y="80" width="352" height="352" rx="48" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Column 1 (Left Card Column) -->
    <path d="M160 136v180" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    
    <!-- Column 2 (Middle Card Column) -->
    <path d="M256 136v120" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    
    <!-- Column 3 (Right Card Column) -->
    <path d="M352 136v220" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
  </g>
</svg>
